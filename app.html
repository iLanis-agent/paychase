<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayChase - late invoices don't chase themselves</title>
<style>
  :root { --bg:#12110f; --panel:#1b1915; --line:#333026; --text:#f5f1e8; --dim:#a89f8c; --accent:#e8c872; --stale:#ff8f7a; --late:#ffcf7a; --fresh:#c8d47a; --ok:#8be0a4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(640px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#100f0c; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#12110f; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .strip { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:#100f0c; border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1; min-width:110px; text-align:center; }
  .stat .n { font-size:22px; font-weight:900; }
  .stat .l { color:var(--dim); font-size:11px; margin-top:2px; }
  .inv { background:#100f0c; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:8px; }
  .inv .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .inv .client { font-weight:700; }
  .inv .amt { font-size:18px; font-weight:900; }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; line-height:1.7; }
  .meta b { color:var(--text); font-weight:600; }
  .chip { font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; }
  .c-stale { background:var(--stale); color:#12110f; }
  .c-late { background:var(--late); color:#12110f; }
  .c-fresh { background:var(--fresh); color:#12110f; }
  .c-due-today { background:var(--accent); color:#12110f; }
  .c-upcoming { background:#3a382e; color:var(--dim); }
  .c-paid { background:var(--ok); color:#12110f; }
  .actions { margin-top:8px; display:flex; gap:12px; }
  .link { background:none; border:none; color:var(--accent); cursor:pointer; font-size:12px; padding:0; text-decoration:underline; }
  .link.dim { color:var(--dim); }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>PayChase</h1>
<div class="sub">late invoices don't chase themselves. track who owes you, when to nudge, and what lateness costs.</div>

<div class="card">
  <div class="strip">
    <div class="stat"><div class="n" id="s-out">$0</div><div class="l">outstanding</div></div>
    <div class="stat"><div class="n" id="s-over">$0</div><div class="l">overdue</div></div>
    <div class="stat"><div class="n" id="s-fees">$0</div><div class="l">late fees accrued</div></div>
    <div class="stat"><div class="n" id="s-stale">-</div><div class="l">oldest overdue</div></div>
  </div>
</div>

<div class="card">
  <h2>Add an invoice</h2>
  <div class="row">
    <div><label>Client</label><input id="i-client" placeholder="e.g. Acme Studio"></div>
    <div><label>Amount</label><input id="i-amount" type="number" min="0" step="any" placeholder="2400"></div>
    <div><label>Issued</label><input id="i-date" type="date"></div>
    <div><label>Terms</label><select id="i-terms"><option value="0">due on receipt</option><option value="7">net 7</option><option value="14" selected>net 14</option><option value="30">net 30</option><option value="60">net 60</option></select></div>
    <div><label>Late fee %/mo</label><input id="i-rate" type="number" min="0" step="any" value="5" style="width:70px"></div>
    <button id="add">Track it</button>
  </div>
</div>

<div class="card">
  <h2>Your invoices</h2>
  <div id="items"><div class="empty">Nothing outstanding. Add your first invoice above.</div></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'paychase-v1';
  var items = [];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) items = s; } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function money(n) { return '$' + Number(n).toLocaleString(undefined, {maximumFractionDigits: 2}); }

  var BUCKET_LABEL = { stale: 'stale', late: 'late', fresh: 'follow up', 'due-today': 'due today', upcoming: 'open', paid: 'paid' };

  function render() {
    var now = todayISO();
    var sm = PayChase.summary(items, now);
    document.getElementById('s-out').textContent = money(sm.outstanding);
    document.getElementById('s-over').textContent = money(sm.overdue);
    document.getElementById('s-fees').textContent = money(sm.feesAccrued);
    document.getElementById('s-stale').textContent = sm.stalestDays === null ? '-' : sm.stalestDays + 'd';

    var el = document.getElementById('items');
    if (!items.length) { el.innerHTML = '<div class="empty">Nothing outstanding. Add your first invoice above.</div>'; return; }
    el.innerHTML = '';
    PayChase.sortInvoices(items, now).forEach(function (d) {
      var inv = d.invoice;
      var div = document.createElement('div');
      div.className = 'inv';
      var meta;
      if (inv.paid) {
        meta = 'paid - nice work';
      } else {
        var bits = ['due <b>' + d.due + '</b>'];
        if (d.daysOver > 0) bits.push('<b>' + d.daysOver + 'd overdue</b>');
        else if (d.daysOver === 0) bits.push('<b>due today</b>');
        else bits.push('due in ' + (-d.daysOver) + 'd');
        if (d.fee > 0) bits.push('late fee accrued: <b>' + money(d.fee) + '</b>');
        if (d.nudge) bits.push('next nudge: <b>' + d.nudge + '</b>');
        meta = bits.join(' &middot; ');
      }
      div.innerHTML = '<div class="top"><span><span class="chip c-' + d.bucket + '">' + BUCKET_LABEL[d.bucket] + '</span> ' +
        '<span class="client">' + esc(inv.client) + '</span></span>' +
        '<span class="amt">' + money(inv.amount) + '</span></div>' +
        '<div class="meta">' + meta + '</div>' +
        '<div class="actions">' +
        (!inv.paid ? '<button class="link" data-paid="' + inv.id + '">mark paid</button>' : '') +
        '<button class="link dim" data-del="' + inv.id + '">remove</button></div>';
      el.appendChild(div);
    });
    el.querySelectorAll('[data-paid]').forEach(function (b) {
      b.addEventListener('click', function () {
        items.forEach(function (x) { if (x.id === b.getAttribute('data-paid')) x.paid = true; });
        save(); render();
      });
    });
    el.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        items = items.filter(function (x) { return x.id !== b.getAttribute('data-del'); });
        save(); render();
      });
    });
  }

  document.getElementById('add').addEventListener('click', function () {
    var client = document.getElementById('i-client').value.trim();
    var amount = parseFloat(document.getElementById('i-amount').value);
    var date = document.getElementById('i-date').value;
    if (!client || !amount || !date) return;
    items.push({
      id: 'i' + Date.now(),
      client: client,
      amount: amount,
      issued: date,
      termsDays: +document.getElementById('i-terms').value,
      lateRate: parseFloat(document.getElementById('i-rate').value) || 0,
      paid: false
    });
    document.getElementById('i-client').value = '';
    document.getElementById('i-amount').value = '';
    save(); render();
  });

  // test hook
  window.__pc = {
    clear: function () { items = []; save(); render(); },
    add: function (client, amount, issued, termsDays, lateRate, paid) {
      items.push({ id: 'i' + Math.random(), client: client, amount: amount, issued: issued, termsDays: termsDays, lateRate: lateRate || 0, paid: !!paid });
      save(); render();
    },
    read: function () {
      return {
        clients: Array.prototype.map.call(document.querySelectorAll('#items .client'), function (d) { return d.textContent; }),
        chips: Array.prototype.map.call(document.querySelectorAll('#items .chip'), function (d) { return d.textContent; }),
        metas: Array.prototype.map.call(document.querySelectorAll('#items .meta'), function (d) { return d.textContent; }),
        out: document.getElementById('s-out').textContent,
        over: document.getElementById('s-over').textContent,
        fees: document.getElementById('s-fees').textContent,
        stale: document.getElementById('s-stale').textContent
      };
    }
  };

  document.getElementById('i-date').value = todayISO();
  load();
  render();
})();
</script>
</body>
</html>
